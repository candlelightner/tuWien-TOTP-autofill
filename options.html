<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>TOTP Autofill Einstellungen</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 16px;
    }
    label {
      display: block;
      margin-top: 16px;
      font-weight: 600;
    }
    textarea {
      width: 100%;
      min-height: 100px;
      padding: 10px;
      margin-top: 6px;
      box-sizing: border-box;
      font-size: 14px;
      resize: vertical;
    }
    button {
      margin-top: 20px;
      padding: 10px 16px;
      font-size: 14px;
    }
    #status {
      margin-top: 16px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>TOTP Autofill TU</h1>

  <label for="otpauth">OTPAuth-URL oder Base32-Secret</label>
  <textarea id="otpauth" placeholder="otpauth://totp/..."></textarea>

  <button id="save">Speichern</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
