name: CI

on:
  push:
    branches: [main, hardening]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: extensions
          path: |
            dist/*.zip
            dist/safari/
      # Optional: signs an *unlisted* Firefox build (installable, not public on AMO).
      # Add AMO_JWT_ISSUER / AMO_JWT_SECRET as repository secrets to enable.
      - name: Sign Firefox (unlisted)
        if: startsWith(github.ref, 'refs/tags/v') && env.AMO_JWT_ISSUER != ''
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: >
          npx web-ext sign --source-dir dist/firefox --channel unlisted
          --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" --artifacts-dir dist/signed
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: firefox-signed
          path: dist/signed/
          if-no-files-found: ignore

  safari:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run safari
      - name: Build macOS app (unsigned)
        run: >
          xcodebuild -project "safari/TU TOTP Autofill/TU TOTP Autofill.xcodeproj"
          -scheme "TU TOTP Autofill (macOS)" -configuration Release
          -destination "generic/platform=macOS"
          CODE_SIGNING_ALLOWED=NO build | tail -n 20
      - name: Build iOS app (unsigned)
        run: >
          xcodebuild -project "safari/TU TOTP Autofill/TU TOTP Autofill.xcodeproj"
          -scheme "TU TOTP Autofill (iOS)" -configuration Release
          -destination "generic/platform=iOS"
          CODE_SIGNING_ALLOWED=NO build | tail -n 20

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, safari]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extensions
          path: dist
      - run: cd dist && zip -qr tuwien-totp-autofill-safari-source.zip safari && sha256sum *.zip > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
